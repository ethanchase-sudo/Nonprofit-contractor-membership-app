<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Member App — Mobile Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#13294B; --navy-2:#1D3A66; --navy-3:#2B4C80;
  --ink:#23272F; --ink-2:#4A505B; --muted:#6B7280;
  --line:#E3E6EB; --bg:#F4F5F7; --white:#FFFFFF;
  --orange:oklch(0.70 0.17 52); --orange-d:oklch(0.60 0.16 48); --orange-soft:oklch(0.96 0.03 60);
  --green:oklch(0.62 0.13 155); --green-soft:oklch(0.95 0.04 155);
  --blue-soft:oklch(0.95 0.02 255);
  --r:16px;
  --fh:'Archivo',system-ui,sans-serif; --fb:'Public Sans',system-ui,sans-serif; --fm:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--fb);color:var(--ink);background:#DADDE2;display:grid;place-items:center;overflow:hidden;
  background-image:radial-gradient(circle at 50% 0%, #E9EBEE 0%, #D3D7DD 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}
svg.i.xs{width:15px;height:15px}

/* ---------- Device ---------- */
.device{width:390px;height:844px;border-radius:54px;background:#0E0F12;padding:11px;box-shadow:0 0 0 2px #2A2C31,0 40px 80px -20px rgba(15,25,45,.45),0 10px 30px rgba(15,25,45,.18);transform-origin:center;flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#0E0F12;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 15px/1 var(--fb);z-index:50;color:var(--ink);transition:color .3s;pointer-events:none}
.statusbar .sig{display:flex;gap:6px;align-items:center}
.statusbar .bars{display:flex;gap:2px;align-items:flex-end}
.statusbar .bars i{display:block;width:3px;background:currentColor;border-radius:1px}
.statusbar .batt{width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1.5px;opacity:.9}
.statusbar .batt i{display:block;height:100%;width:75%;background:currentColor;border-radius:1.5px}
@media (max-width:500px){
  body{display:block;background:var(--bg)}
  .device{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none;transform:none!important}
  .screen{border-radius:0}
  .island,.statusbar{display:none}
  .view-scroll{padding-top:12px!important}
}

/* ---------- Views ---------- */
.views{position:absolute;inset:0;bottom:0}
.view{position:absolute;inset:0;transition:transform .42s cubic-bezier(.32,.72,0,1),opacity .42s;will-change:transform;background:var(--bg)}
.view-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:56px 0 110px;scrollbar-width:none}
.view-scroll::-webkit-scrollbar{display:none}
#view-home{transform:translateX(0)}
#view-portal{transform:translateX(100%)}
.on-portal #view-home{transform:translateX(-28%);opacity:.6}
.on-portal #view-portal{transform:translateX(0)}

/* ---------- Common ---------- */
.pad{padding:0 20px}
.press{transition:transform .14s ease,background-color .2s,box-shadow .2s}
.press:active{transform:scale(.97)}
.h-sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 20px 12px}
.h-sec h2{font:700 18px/1.2 var(--fh);letter-spacing:-.01em;color:var(--ink)}
.h-sec .link{font:600 14px var(--fb);color:var(--navy-3);padding:6px 0 6px 10px;display:flex;align-items:center;gap:2px}
.tag{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--fb);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--blue-soft);color:var(--navy-2)}
.tag.orange{background:var(--orange-soft);color:var(--orange-d)}
.tag.green{background:var(--green-soft);color:oklch(0.45 0.11 155)}
.tag.gray{background:#EEF0F3;color:var(--ink-2)}
.card{background:var(--white);border-radius:var(--r);box-shadow:0 1px 2px rgba(19,41,75,.06),0 0 0 1px rgba(19,41,75,.05)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;position:relative;background:var(--white);box-shadow:0 0 0 1px var(--line)}
.badge{position:absolute;top:7px;right:7px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--orange);color:#fff;font:700 11px/18px var(--fb);text-align:center;box-shadow:0 0 0 2px var(--white);transition:transform .25s}
.badge.hide{transform:scale(0)}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 15px var(--fh);letter-spacing:.02em}
mark{background:oklch(0.92 0.08 70);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- Home ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:8px 20px 0}
.logo{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font:500 9px var(--fm);color:var(--muted);letter-spacing:.06em;
  background:repeating-linear-gradient(135deg,#E6E9EE 0 6px,#F1F3F6 6px 12px);box-shadow:inset 0 0 0 1px #D2D7DF}
.orgname{flex:1;min-width:0}
.orgname b{display:block;font:700 15px/1.2 var(--fh);color:var(--ink)}
.orgname span{font:500 10.5px var(--fm);color:var(--muted);letter-spacing:.04em}
.greet{padding:22px 20px 16px}
.greet p{font:500 13px var(--fb);color:var(--muted);margin-bottom:4px}
.greet h1{font:800 28px/1.1 var(--fh);letter-spacing:-.02em;color:var(--ink)}

.mcard-wrap{perspective:1200px;margin:0 20px}
.mcard{position:relative;height:190px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.1,1);cursor:pointer}
.mcard.flip{transform:rotateY(180deg)}
.mface{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;color:#fff;padding:18px 20px;
  background:linear-gradient(155deg,var(--navy-2) 0%,var(--navy) 60%,#0D1F3A 100%);box-shadow:0 14px 30px -12px rgba(19,41,75,.55)}
.mface::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.07);box-shadow:0 0 0 30px rgba(255,255,255,.025),0 0 0 60px rgba(255,255,255,.02)}
.mface .stripe{position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(135deg,var(--orange) 0 10px,transparent 10px 20px);opacity:.85}
.mrow{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.mlabel{font:500 10.5px var(--fm);letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.mname{font:700 22px/1.15 var(--fh);margin-top:16px;letter-spacing:-.01em}
.mco{font:500 13.5px var(--fb);opacity:.75;margin-top:3px}
.status{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:20px;font:600 12px var(--fb)}
.status i{width:7px;height:7px;border-radius:50%;background:oklch(0.80 0.15 155);box-shadow:0 0 0 3px oklch(0.80 0.15 155 / .25)}
.mfoot{position:absolute;left:20px;right:20px;bottom:20px;display:flex;gap:26px;z-index:1}
.mfoot div span{display:block;font:500 10px var(--fm);letter-spacing:.1em;opacity:.6;text-transform:uppercase;margin-bottom:4px}
.mfoot div b{font:600 14px var(--fb)}
.mfoot .flipcue{margin-left:auto;align-self:flex-end;font:500 11px var(--fb);opacity:.6;display:flex;align-items:center;gap:4px}
.mback{transform:rotateY(180deg);display:flex;gap:18px;align-items:center}
.qr{width:120px;height:120px;border-radius:12px;background:#fff;flex:none;display:grid;place-items:center;font:500 9px var(--fm);color:#7A8190;text-align:center;letter-spacing:.06em;
  background-image:repeating-linear-gradient(0deg,#EEF0F3 0 6px,#fff 6px 12px)}
.mback p{font:500 12.5px/1.5 var(--fb);opacity:.8}
.mback b{display:block;font:700 18px var(--fh);margin:6px 0 2px;letter-spacing:.02em}

.alert{margin:16px 20px 0;display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--orange-soft);box-shadow:inset 0 0 0 1px oklch(0.88 0.06 60);text-align:left;width:calc(100% - 40px)}
.alert .ic{width:38px;height:38px;border-radius:11px;background:var(--orange);color:#fff;display:grid;place-items:center;flex:none}
.alert b{display:block;font:700 14px/1.3 var(--fb);color:var(--ink)}
.alert span{font:500 12.5px/1.35 var(--fb);color:var(--ink-2)}
.alert .go{margin-left:auto;color:var(--orange-d)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.qcard{padding:16px;text-align:left;display:flex;flex-direction:column;gap:14px;min-height:118px;position:relative}
.qcard .qi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--navy-2)}
.qcard.primary{background:var(--navy);color:#fff;box-shadow:0 10px 24px -12px rgba(19,41,75,.6)}
.qcard.primary .qi{background:rgba(255,255,255,.12);color:#fff}
.qcard.primary small{color:rgba(255,255,255,.65)}
.qcard b{font:700 15.5px/1.2 var(--fh);display:block}
.qcard small{font:500 12.5px var(--fb);color:var(--muted);display:block;margin-top:3px}
.qcard .cnt{position:absolute;top:16px;right:16px;font:700 11px var(--fb);background:var(--orange);color:#fff;border-radius:10px;padding:3px 7px}
.qcard:hover{box-shadow:0 0 0 1px rgba(19,41,75,.12),0 8px 18px -10px rgba(19,41,75,.25)}

.events{display:flex;gap:12px;overflow-x:auto;padding:2px 20px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.events::-webkit-scrollbar{display:none}
.ecard{flex:none;width:262px;padding:14px;display:flex;gap:14px;text-align:left;scroll-snap-align:start}
.edate{width:54px;flex:none;border-radius:12px;background:var(--bg);text-align:center;padding:8px 0;box-shadow:inset 0 0 0 1px var(--line)}
.edate span{display:block;font:600 11px var(--fm);letter-spacing:.1em;color:var(--orange-d)}
.edate b{display:block;font:800 24px/1.1 var(--fh);color:var(--ink)}
.ecard h3{font:700 14.5px/1.3 var(--fb);color:var(--ink);margin-bottom:6px}
.ecard .meta{display:flex;align-items:center;gap:5px;font:500 12.5px var(--fb);color:var(--muted);margin-top:3px}
.ecard .reg{margin-top:8px}

.updates{margin:0 20px;overflow:hidden}
.uitem{display:flex;gap:14px;align-items:center;padding:14px 16px;width:100%;text-align:left;border-top:1px solid var(--line)}
.uitem:first-child{border-top:0}
.uitem:active{background:var(--bg)}
.uthumb{width:56px;height:56px;border-radius:12px;flex:none;display:grid;place-items:center;color:var(--navy-2);background:var(--blue-soft)}
.uitem h3{font:600 14.5px/1.35 var(--fb);color:var(--ink);margin:6px 0 4px;text-wrap:pretty}
.uitem p{font:500 12px var(--fb);color:var(--muted)}

/* ---------- Portal ---------- */
.p-head{position:sticky;top:-56px;z-index:5;background:var(--bg);padding:56px 0 10px;margin-top:-56px}
.p-title{display:flex;align-items:center;gap:8px;padding:8px 20px 14px}
.p-title .back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-left:-8px;color:var(--ink)}
.p-title .back:active{background:#E8EBEF}
.p-title h1{font:800 24px/1.1 var(--fh);letter-spacing:-.02em;flex:1}
.p-title .web{font:600 12.5px var(--fb);color:var(--navy-3);display:flex;gap:5px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--white);box-shadow:0 0 0 1px var(--line)}
.search{margin:0 20px;display:flex;align-items:center;gap:10px;background:var(--white);border-radius:14px;padding:0 6px 0 14px;height:50px;box-shadow:0 0 0 1px var(--line);transition:box-shadow .2s;color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 2px var(--navy-3),0 6px 16px -8px rgba(19,41,75,.3)}
.search input{flex:1;border:0;outline:0;background:none;font:500 15.5px var(--fb);color:var(--ink);min-width:0}
.search input::placeholder{color:#9AA0AA}
.search .clear{width:36px;height:36px;border-radius:10px;display:none;place-items:center;color:var(--muted)}
.search.has .clear{display:grid}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:19px;background:var(--white);box-shadow:0 0 0 1px var(--line);font:600 13.5px var(--fb);color:var(--ink-2);display:flex;align-items:center;gap:6px;transition:all .2s}
.chip .n{font:600 11.5px var(--fb);color:var(--muted)}
.chip.on{background:var(--navy);color:#fff;box-shadow:none}
.chip.on .n{color:rgba(255,255,255,.6)}

.acct{margin:12px 20px 0;padding:16px;display:block;width:calc(100% - 40px);text-align:left}
.acct-top{display:flex;gap:12px;align-items:center}
.acct-top .avatar{width:46px;height:46px}
.acct-top b{font:700 16px var(--fh);display:block}
.acct-top span{font:500 12.5px var(--fb);color:var(--muted)}
.acct-top .tag{margin-left:auto}
.acct-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.acct-stats div{padding:0 4px}
.acct-stats div+div{border-left:1px solid var(--line);padding-left:12px}
.acct-stats span{display:block;font:500 11px var(--fb);color:var(--muted);margin-bottom:4px}
.acct-stats b{font:700 15px var(--fh);color:var(--ink)}
.prog{height:5px;border-radius:3px;background:#E8EBEF;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--orange);border-radius:3px}

.sec{margin-top:24px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 20px 10px}
.sec-h h2{font:700 16px var(--fh);color:var(--ink)}
.sec-h .c{font:600 12px var(--fb);color:var(--muted);background:#E8EBEF;border-radius:10px;padding:2px 8px}
.list{margin:0 20px;overflow:hidden}
.ritem{display:flex;gap:12px;align-items:center;width:100%;padding:13px 14px;text-align:left;border-top:1px solid var(--line);animation:fadeUp .35s both}
.ritem:first-child{border-top:0}
.ritem:active{background:var(--bg)}
.rico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--navy-2)}
.rico.orange{background:var(--orange-soft);color:var(--orange-d)}
.rico.green{background:var(--green-soft);color:oklch(0.45 0.11 155)}
.rico.gray{background:#EEF0F3;color:var(--ink-2)}
.rbody{flex:1;min-width:0}
.rbody h3{font:600 14.5px/1.3 var(--fb);color:var(--ink);text-wrap:pretty}
.rbody p{font:500 12.5px/1.35 var(--fb);color:var(--muted);margin-top:2px}
.rbody .prog{max-width:160px}
.ract{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--navy-3);background:var(--bg);transition:all .25s}
.ract.chev{background:none;color:#A3A9B3;width:24px}
.ract.loading{color:var(--orange-d)}
.ract.loading svg{animation:bob .6s infinite alternate}
.ract.done{background:var(--green-soft);color:oklch(0.48 0.12 155)}
.ritem .new{font:700 10px var(--fb);color:#fff;background:var(--orange);border-radius:5px;padding:2px 5px;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
.ann{margin:0 20px 10px;padding:16px;display:block;width:calc(100% - 40px);text-align:left;animation:fadeUp .35s both}
.ann h3{font:700 15px/1.35 var(--fb);margin:8px 0 6px;color:var(--ink);text-wrap:pretty}
.ann p{font:500 13px/1.45 var(--fb);color:var(--ink-2)}
.ann .when{display:flex;justify-content:space-between;align-items:center}
.ann .when small{font:500 12px var(--fb);color:var(--muted)}
.empty{text-align:center;padding:50px 30px;color:var(--muted)}
.empty .ei{width:60px;height:60px;border-radius:18px;background:#E8EBEF;display:grid;place-items:center;margin:0 auto 14px;color:var(--ink-2)}
.empty b{display:block;font:700 16px var(--fh);color:var(--ink);margin-bottom:6px}
.empty p{font:500 13.5px/1.5 var(--fb)}
.empty button{margin-top:16px;font:600 14px var(--fb);color:var(--navy-3);padding:10px 16px;border-radius:12px;background:var(--white);box-shadow:0 0 0 1px var(--line)}
.resultline{margin:16px 20px 0;font:500 13px var(--fb);color:var(--muted)}
.resultline b{color:var(--ink)}
.help{margin:28px 20px 0;padding:18px;display:flex;gap:14px;align-items:center;background:var(--navy);color:#fff;border-radius:var(--r);width:calc(100% - 40px);text-align:left}
.help .ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.help b{font:700 15px var(--fh);display:block}
.help span{font:500 12.5px var(--fb);opacity:.7}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bob{from{transform:translateY(-2px)}to{transform:translateY(2px)}}

/* ---------- Tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 26px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:#8A909A;font:600 11.5px var(--fb);position:relative;transition:color .2s}
.tab .ti{width:52px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .25s}
.tab.on{color:var(--navy)}
.tab.on .ti{background:var(--blue-soft)}
.tab .badge{top:2px;right:calc(50% - 22px)}
@media (max-width:500px){.tabbar{padding-bottom:max(12px,env(safe-area-inset-bottom))}}

/* ---------- Sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(13,22,38,.45);opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;z-index:45;background:var(--white);border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .45s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(13,22,38,.2)}
.sheet.on{transform:translateY(0)}
.grab{width:100%;padding:10px 0 4px;display:grid;place-items:center;flex:none}
.grab i{width:40px;height:5px;border-radius:3px;background:#D5D9E0}
.sh-head{display:flex;align-items:center;gap:10px;padding:6px 20px 12px;flex:none}
.sh-head h2{font:800 21px/1.2 var(--fh);letter-spacing:-.01em;flex:1}
.sh-head .x{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--ink-2)}
.sh-head .txtbtn{font:600 13.5px var(--fb);color:var(--navy-3);padding:8px 6px}
.sh-body{overflow-y:auto;padding:0 20px 34px;scrollbar-width:none}
.sh-body::-webkit-scrollbar{display:none}

.nitem{display:flex;gap:12px;padding:14px 4px;border-top:1px solid var(--line);width:100%;text-align:left;align-items:flex-start;border-radius:0;transition:background .2s}
.nitem:first-child{border-top:0}
.nitem:active{background:var(--bg)}
.nitem .rico{width:40px;height:40px}
.nitem h3{font:700 14.5px/1.3 var(--fb);color:var(--ink)}
.nitem.read h3{font-weight:500;color:var(--ink-2)}
.nitem p{font:500 13px/1.4 var(--fb);color:var(--muted);margin-top:3px}
.nitem small{font:500 11.5px var(--fb);color:#9AA0AA;margin-top:6px;display:block}
.nitem .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);margin-top:6px;flex:none;transition:transform .25s}
.nitem.read .dot{transform:scale(0)}
.nseg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:8px}
.nseg button{flex:1;height:36px;border-radius:9px;font:600 13.5px var(--fb);color:var(--ink-2);transition:all .2s}

button.row:active{background:var(--bg)}
.row .k{font:500 14px var(--fb);color:var(--muted);flex:1}
.row .v{font:600 14px var(--fb);color:var(--ink);text-align:right}

.row .lbl small{display:block;font:500 12.5px var(--fb);color:var(--muted);margin-top:2px}
.toggle{width:50px;height:30px;border-radius:15px;background:#D5D9E0;position:relative;flex:none;transition:background .25s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,.7,.2,1.2)}
.toggle.on{background:var(--navy-3)}
.toggle.on::after{transform:translateX(20px)}
.sh-label{font:600 12px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 0}
.btn{height:52px;border-radius:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15.5px var(--fb);transition:transform .14s,background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);color:#fff}
.btn.orange{background:var(--orange);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.success{background:var(--green-soft);color:oklch(0.42 0.11 155)}
.btn-row{display:flex;gap:10px;margin-top:20px}
.renew{margin-top:14px;padding:16px;border-radius:var(--r);background:var(--orange-soft);display:flex;gap:12px;align-items:center}
.renew b{font:700 14.5px var(--fb);display:block}
.renew span{font:500 12.5px var(--fb);color:var(--ink-2)}
.renew button{margin-left:auto;font:700 13.5px var(--fb);background:var(--orange);color:#fff;padding:10px 14px;border-radius:11px;flex:none}

.detail-hero{border-radius:var(--r);height:150px;margin-bottom:16px;display:grid;place-items:center;font:500 11px var(--fm);color:#7A8190;letter-spacing:.06em;

.detail h3{font:800 22px/1.25 var(--fh);letter-spacing:-.01em;margin:10px 0 10px;text-wrap:pretty}
.detail p{font:400 15px/1.6 var(--fb);color:var(--ink-2);margin-bottom:12px;text-wrap:pretty}

      <button class="clear" data-act="clearq" aria-label="Clear search">${I('x','sm')}</button>
    </label>
    <div class="chips" id="chips"></div>
  </div>
  <div id="portal-body"></div>`;
  $('#q').addEventListener('input', e=>{ state.q=e.target.value.trim(); $('#searchbox').classList.toggle('has',!!e.target.value); renderPortalBody(); });
}

function renderChips(){
  $('#chips').innerHTML = CATS.map(c=>{
    const n = c.k==='all' ? resources.filter(matches).length : resources.filter(r=>r.cat===c.k&&matches(r)).length;
    return `<button class="chip press ${state.cat===c.k?'on':''}" data-cat-chip="${c.k}">${c.l}<span class="n">${n}</span></button>`;
  }).join('');
}

function itemRow(r,i){
  const dl = state.downloaded.has(r.id);
  let action;
  if(r.act==='dl') action = `<span class="ract ${dl?'done':''}" data-dl="${r.id}" aria-label="Download">${I(dl?'check':'download','sm')}</span>`;
  else action = `<span class="ract chev">${I('chev','sm')}</span>`;
  const prog = r.prog!=null && r.prog<100 ? `<div class="prog"><i style="width:${r.prog}%"></i></div>` : '';
  return `<button class="ritem" data-res="${r.id}" style="animation-delay:${Math.min(i,8)*30}ms">
    <span class="rico ${r.tone||''}">${I(r.icon,'sm')}</span>
    <span class="rbody"><h3>${hl(r.title)}${r.isNew?'<span class="new">NEW</span>':''}</h3><p>${hl(r.meta)}</p>${prog}</span>
    ${action}
  </button>`;
}
function annCard(r,i){
  return `<button class="ann card press" data-res="${r.id}" style="animation-delay:${i*40}ms">
    <div class="when"><span class="tag ${r.tag==='Safety'?'orange':r.tag==='Office'?'gray':''}">${r.pinned?'📌 ':''}${r.tag}</span><small>${r.when}</small></div>
    <h3>${hl(r.title)}</h3><p>${hl(r.body)}</p>
  </button>`.replace('📌 ','');
}

function renderPortalBody(){
  renderChips();
  const list = filtered();
  let html = '';
  if(state.cat==='all' && !state.q){
    html += `
    <button class="acct card press" data-act="profile">
      <div class="acct-top">
        <span class="avatar">${member.initials}</span>
        <span><b>${member.name}</b><span>${member.company} · ${member.id}</span></span>
        <span class="tag green">Active</span>
      </div>
      <div class="acct-stats">
        <div><span>Dues</span><b>Paid</b></div>
        <div><span>CE hours</span><b>${member.ce} / ${member.ceGoal}</b><div class="prog"><i style="width:${member.ce/member.ceGoal*100}%"></i></div></div>
        <div><span>Renews</span><b>3/31/27</b></div>
      </div>
    </button>`;
  }
  if(state.q) html += `<div class="resultline"><b>${list.length}</b> result${list.length===1?'':'s'} for “${state.q.replace(/</g,'&lt;')}”</div>`;
  if(!list.length){
    html += `<div class="empty"><div class="ei">${I('search')}</div><b>No matches found</b><p>Try a different keyword, or browse all categories.</p><button data-act="reset">Clear search & filters</button></div>`;
  } else {
    CATS.filter(c=>c.k!=='all').forEach(c=>{
      const items = list.filter(r=>r.cat===c.k);
      if(!items.length) return;
      html += `<div class="sec"><div class="sec-h"><h2>${c.t}</h2><span class="c">${items.length}</span></div>`;
      html += c.k==='announcements' ? items.map(annCard).join('') : `<div class="list card">${items.map(itemRow).join('')}</div>`;
      html += `</div>`;
    });
  }
  html += `<button class="help press" data-act="contact"><span class="ic">${I('help')}</span><span><b>Need help with your account?</b><span>Contact member services</span></span><span style="margin-left:auto;opacity:.6">${I('chev','sm')}</span></button>`;
  $('#portal-body').innerHTML = html;
}

/* ================= NAV ================= */
function setTabs(){
  const active = state.sheet==='notifs'?'notifs':state.sheet==='profile'?'profile':state.view;
  const tabs = [['home','home','Home'],['portal','folder','Resources'],['notifs','bell','Notifications'],['profile','user','Profile']];
  const n = unread();
  $('#tabbar').innerHTML = tabs.map(([k,ic,l])=>`<button class="tab ${active===k?'on':''}" data-tab="${k}"><span class="ti">${I(ic)}</span>${l}${k==='notifs'?`<span class="badge ${n?'':'hide'}">${n}</span>`:''}</button>`).join('');
}
function go(view, cat){
  if(cat){ state.cat=cat; state.q=''; const q=$('#q'); if(q){q.value='';$('#searchbox').classList.remove('has');} renderPortalBody(); localStorage.setItem('mp_cat',cat); }
  if(view!==state.view){
    state.view=view; localStorage.setItem('mp_view',view);
    $('#screen').classList.toggle('on-portal', view==='portal');
    if(view==='portal') $('#portal-scroll').scrollTop=0;
  } else if(view==='portal' && cat){ $('#portal-scroll').scrollTo({top:0,behavior:'smooth'}); }
  else if(view==='home'){ $('#home-scroll').scrollTo({top:0,behavior:'smooth'}); }
  closeSheet(true);
  setTabs();
}

/* ================= SHEETS ================= */
function openSheet(kind, html){
  state.sheet = kind;
  $('#sheet-inner').innerHTML = html;
  $('#sheet-inner').querySelector('.sh-body')?.scrollTo(0,0);
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  setTabs();
}
function closeSheet(silent){
  if(!state.sheet) return;
  state.sheet=null;
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  if(!silent) setTabs();
}
const head = (t, extra='') => `<div class="sh-head"><h2>${t}</h2>${extra}<button class="x" data-close aria-label="Close">${I('x','sm')}</button></div>`;

function notifsSheet(){
  const list = notifs.filter(n=>state.nfilter==='all'||!n.read);
  openSheet('notifs', head('Notifications', unread()?`<button class="txtbtn" data-act="markall">Mark all read</button>`:'') + `
  <div class="sh-body">
    <div class="nseg"><button class="${state.nfilter==='all'?'on':''}" data-nf="all">All</button><button class="${state.nfilter==='unread'?'on':''}" data-nf="unread">Unread (${unread()})</button></div>
    ${list.length? list.map(n=>`
      <button class="nitem ${n.read?'read':''}" data-notif="${n.id}">
        <span class="rico ${n.tone||''}">${I(n.icon,'sm')}</span>
        <span style="flex:1;min-width:0"><h3>${n.title}</h3><p>${n.body}</p><small>${n.when}</small></span>
        <span class="dot"></span>
      </button>`).join('') : `<div class="empty"><div class="ei">${I('check')}</div><b>You’re all caught up</b><p>No unread notifications.</p></div>`}
  </div>`);
}

function profileSheet(){
  const t = (k,l,s)=>`<button class="row" data-pref="${k}"><span class="lbl">${l}<small>${s}</small></span><span class="toggle ${state.prefs[k]?'on':''}"></span></button>`;
  openSheet('profile', head('Profile') + `
  <div class="sh-body">
    <div class="pf-top"><span class="avatar">${member.initials}</span><span><b>${member.name}</b><span>${member.company}</span></span></div>
    <div class="renew"><span><b>Renew early & save</b><span>Lock in 2026 rates before Jan 31</span></span><button data-act="renew">Renew</button></div>
    <div class="sh-label">Membership</div>
    <div class="rows">
      <div class="row"><span class="k">Status</span><span class="tag green">● Active</span></div>
      <div class="row"><span class="k">Member ID</span><span class="v">${member.id}</span></div>
      <div class="row"><span class="k">Membership type</span><span class="v">${member.type}</span></div>
      <div class="row"><span class="k">Trade</span><span class="v">${member.trade}</span></div>
      <div class="row"><span class="k">Member since</span><span class="v">${member.since}</span></div>
      <div class="row"><span class="k">Renewal date</span><span class="v">${member.renews}</span></div>
      <button class="row" data-act="showcard"><span class="lbl">Digital member card<small>Show at events & partner suppliers</small></span>${I('card','sm')}</button>
    </div>
    <div class="sh-label">Contact</div>
    <div class="rows">
      <button class="row" data-act="edit"><span class="k">Email</span><span class="v">${member.email}</span>${I('edit','xs')}</button>
      <button class="row" data-act="edit"><span class="k">Phone</span><span class="v">${member.phone}</span>${I('edit','xs')}</button>
    </div>
    <div class="sh-label">Notifications</div>
    <div class="rows">
      ${t('push','Push notifications','Alerts, deadlines & renewals')}
      ${t('events','Event reminders','24 hours before registered events')}
      ${t('digest','Weekly email digest','Summary of news & resources')}
    </div>
    <div class="btn-row"><button class="btn ghost" data-act="signout">${I('logout','sm')} Sign out</button></div>
  </div>`);
}

function eventSheet(i){
  const e = events[i], reg = registered.has(i);
  openSheet('event', head('Event details') + `
  <div class="sh-body detail">
    <div class="detail-hero">EVENT PHOTO</div>
    <span class="tag orange">${e.d} ${e.n}</span>
    <h3>${e.title}</h3>
    <p>${e.desc}</p>
    <div class="facts">
      <div class="fact"><span class="rico">${I('clock','sm')}</span>${e.time}</div>
      <div class="fact"><span class="rico">${I('pin','sm')}</span>${e.where}</div>
      <div class="fact"><span class="rico">${I('cap','sm')}</span>${e.ce}</div>
    </div>
    <div class="btn-row">
      <button class="btn ${reg?'success':'orange'}" data-rsvp="${i}">${reg?I('check','sm')+' You’re registered':'Register for event'}</button>
    </div>
    ${reg?`<div class="btn-row" style="margin-top:10px"><button class="btn ghost" data-act="cal">${I('calendar','sm')} Add to calendar</button></div>`:''}
  </div>`);
}

function resSheet(r){
  const cat = CATS.find(c=>c.k===r.cat);
  let body='', btns='';
  if(r.cat==='announcements'){
    body = `<div class="detail-hero">ANNOUNCEMENT IMAGE</div><span class="tag">${r.tag}</span><h3>${r.title}</h3><p style="font-size:13px;color:var(--muted);margin-top:-4px">${r.when}</p><p>${r.body}</p><p>For questions, reach out to member services from your Profile or the Member Portal.</p>`;
    btns = `<button class="btn ghost" data-act="share">Share</button><button class="btn primary" data-close>Done</button>`;
  } else if(r.cat==='benefits'){
    body = `<span class="tag green">${cat.l}</span><h3>${r.title}</h3><p>${r.body}</p><div class="facts"><div class="fact"><span class="rico green">${I('check','sm')}</span>Included with ${member.type}</div><div class="fact"><span class="rico green">${I('card','sm')}</span>Verify with your digital member card</div></div>`;
    btns = `<button class="btn primary" data-act="request" data-title="${r.title}">Request information</button>`;
  } else {
    const p = r.prog ?? null;
    body = `<div class="detail-hero">${r.icon==='play'?'VIDEO PREVIEW':'RESOURCE PREVIEW'}</div><span class="tag">${cat.l}</span><h3>${r.title}</h3><p style="font-size:13px;color:var(--muted);margin-top:-4px">${r.meta}</p><p>${r.body||''}</p>
      ${p!=null?`<div style="margin:6px 0 4px;display:flex;justify-content:space-between;font:600 13px var(--fb)"><span>Progress</span><span>${p}%</span></div><div class="prog" style="height:8px"><i style="width:${p}%"></i></div>`:''}`;
    btns = `<button class="btn primary" data-act="startres" data-title="${r.title}">${p===100?'Review again':p>0?'Continue':r.cat==='training'?'Start':'Open'}</button>`;
  }
  openSheet('res', head(cat.t) + `<div class="sh-body detail">${body}<div class="btn-row">${btns}</div></div>`);
}

function coiSheet(){
  openSheet('coi', head('Certificate of Insurance') + `
  <div class="sh-body detail">
    <span class="tag orange">${I('alert','xs')} Expires Dec 1, 2026</span>
    <h3>Upload your updated COI</h3>
    <p>Keep your certificate current to remain listed in the member contractor directory and eligible for referral programs.</p>
    <div class="rows" style="margin-top:4px">
      <button class="row" data-act="upload"><span class="rico">${I('upload','sm')}</span><span class="lbl">Upload from files<small>PDF, JPG or PNG</small></span>${I('chev','sm')}</button>
      <button class="row" data-act="upload"><span class="rico">${I('card','sm')}</span><span class="lbl">Scan with camera<small>Photograph your certificate</small></span>${I('chev','sm')}</button>
    </div>
    <div class="btn-row"><button class="btn ghost" data-act="remind">Remind me tomorrow</button></div>
  </div>`);
}

/* ================= DOWNLOAD ================= */
function download(id, el){
  if(state.downloaded.has(id)){ toast('Opening saved file…','file'); return; }
  el.classList.add('loading');
  setTimeout(()=>{
    el.classList.remove('loading'); el.classList.add('done'); el.innerHTML = I('check','sm');
    state.downloaded.add(id); localStorage.setItem('mp_dl',JSON.stringify([...state.downloaded]));
    toast('Saved to your device');
  },900);
}

/* ================= EVENTS ================= */
document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-act],[data-close]');
  if(!t) { if(e.target.id==='scrim') closeSheet(); return; }
  const d = t.dataset;

  if('close' in d){ closeSheet(); return; }
  if(d.tab){
    if(d.tab==='notifs') return state.sheet==='notifs'?closeSheet():notifsSheet();
    if(d.tab==='profile') return state.sheet==='profile'?closeSheet():profileSheet();
    return go(d.tab);
  }
  if(d.go){ return go(d.go, d.cat); }
  if(d.catChip){ state.cat=d.catChip; localStorage.setItem('mp_cat',state.cat); renderPortalBody(); $('#portal-scroll').scrollTo({top:0,behavior:'smooth'}); return; }
  if(d.event!=null) return eventSheet(+d.event);
  if(d.rsvp!=null){ const i=+d.rsvp; registered.has(i)?registered.delete(i):registered.add(i); renderHome(); eventSheet(i); if(registered.has(i)) toast('Registered — confirmation sent'); return; }
  if(d.dl){ e.stopPropagation(); return download(d.dl, t.closest('.ritem').querySelector('.ract')); }
  if(d.res){
    const r = resources.find(x=>x.id===d.res);
    if(e.target.closest('[data-dl]')){ return download(r.id, e.target.closest('[data-dl]')); }
    if(r.act==='dl') return download(r.id, t.querySelector('.ract'));
    if(r.act==='coi') return coiSheet();
    return resSheet(r);
  }
  if(d.notif){
    const n = notifs.find(x=>x.id===d.notif); n.read=true; renderHome(); setTabs();
    if(n.go==='coi') return coiSheet();
    if(n.go==='event0') return eventSheet(0);
    if(n.go==='a1') return resSheet(resources.find(r=>r.id==='a1'));
    return go('portal', n.go);
  }
  if(d.nf){ state.nfilter=d.nf; return notifsSheet(); }
  if(d.pref){ state.prefs[d.pref]=!state.prefs[d.pref]; t.querySelector('.toggle').classList.toggle('on'); toast(state.prefs[d.pref]?'Turned on':'Turned off', state.prefs[d.pref]?'check':'x'); return; }

  switch(d.act){
    case 'notifs': return notifsSheet();
    case 'profile': return profileSheet();
    case 'flipcard': $('#mcard').classList.toggle('flip'); return;
    case 'coi': return coiSheet();
    case 'markall': notifs.forEach(n=>n.read=true); renderHome(); notifsSheet(); toast('All notifications marked read'); return;
    case 'clearq': e.preventDefault(); $('#q').value=''; state.q=''; $('#searchbox').classList.remove('has'); renderPortalBody(); $('#q').focus(); return;
    case 'reset': $('#q').value=''; state.q=''; state.cat='all'; $('#searchbox').classList.remove('has'); renderPortalBody(); return;
    case 'web': return toast('Opens the existing web portal in browser','ext');
    case 'contact': return toast('Connecting you with member services…','help');
    case 'allevents': return toast('Full events calendar coming in v2','calendar');
    case 'renew': closeSheet(); return toast('Renewal checkout would open here','card');
    case 'showcard': go('home'); setTimeout(()=>{ $('#home-scroll').scrollTo({top:0,behavior:'smooth'}); $('#mcard').classList.add('flip'); },350); return;
    case 'edit': return toast('Editing contact details syncs with the web portal','edit');
    case 'signout': closeSheet(); return toast('Signed out (demo)','logout');
    case 'upload': state.coiDone=true; closeSheet(); renderHome(); notifs[0].read=true; setTabs(); return toast('Certificate uploaded for review');
    case 'remind': closeSheet(); return toast('We’ll remind you tomorrow','bell');
    case 'cal': return toast('Added to your calendar','calendar');
    case 'share': return toast('Share link copied');
    case 'request': closeSheet(); return toast('Request sent — we’ll be in touch');
    case 'startres': closeSheet(); return toast('Opening “'+d.title+'”…','play');
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

/* ================= SCALE ================= */
function fit(){
  const d=$('#device'); if(innerWidth<=500){d.style.transform='';return;}
  const s=Math.min(1,(innerHeight-32)/866,(innerWidth-32)/412); d.style.transform=`scale(${s})`;
}
addEventListener('resize',fit);

/* ================= INIT ================= */
renderHome(); renderPortalShell(); renderPortalBody(); fit();
if(state.view==='portal'){ $('#view-home').style.transition=$('#view-portal').style.transition='none'; $('#screen').classList.add('on-portal'); requestAnimationFrame(()=>requestAnimationFrame(()=>{ $('#view-home').style.transition=$('#view-portal').style.transition=''; })); }
setTabs();
</script>
